name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
  # release-please.yml calls this after it creates a release. A release made
  # with the workflow token does not fire the release event above.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
          CALLED: ${{ inputs.tag != '' }}
        run: |
          python3 - <<'PY'
          import os

          if os.environ['CALLED'] != 'true' and os.environ['GITHUB_REF_TYPE'] != 'tag':
              raise SystemExit('Run this workflow on a release tag, not a branch.')
          PY
          gh release view "$TAG"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test
        run: python3 tools/test.py
      - name: Build
        run: python3 tools/build.py --android-platform 35 --version "${TAG#v}"
      - name: Attach plugin assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$TAG" \
            dist/*.zip \
            dist/*.zip.sha256 \
            dist/kiosk-satellite-plugin.json --clobber
